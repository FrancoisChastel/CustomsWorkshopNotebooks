[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-methods"
version = "1.0.0"
description = "Methods for the customs breakouts of the workshop Data Driven Domestic Revenue Mobilization (Bangkok, October 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "rapidfuzz>=3.0", "networkx>=3.0", "pyarrow>=12"]

[tool.setuptools]
packages = ["workshop_methods"]
